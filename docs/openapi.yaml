          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        answers:
          readOnly: true
        asset_snapshot:
          readOnly: true
        service_snapshot:
          readOnly: true
        review_unlocked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        customer:
          allOf:
          - $ref: '#/components/schemas/CustomerContact'
          readOnly: true
      required:
      - answers
      - asset_id
      - asset_snapshot
      - confirmed_at
      - created_at
      - customer
      - form_id
      - id
      - is_test
      - language
      - number
      - payment_status
      - review_unlocked_at
      - service_id
      - service_slug
      - service_snapshot
      - status
      - updated_at
      - version
    RoleEnum:
      enum:
      - client
      - appraiser
      - admin
      type: string
      description: |-
        * `client` - Клиент
        * `appraiser` - Оценщик
        * `admin` - Администратор
    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        category:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        summary:
          type: string
          readOnly: true
        form_id:
          type: string
          format: uuid
          readOnly: true
        form_version:
          type: integer
          readOnly: true
      required:
      - category
      - form_id
      - form_version
      - id
      - slug
      - summary
      - title
    SubmitRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        confirmed:
          type: boolean
      required:
      - confirmed
      - expected_version
    TokenPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        token_type:
          type: string
        access_expires_in:
          type: integer
        session_expires_at:
          type: string
          format: date-time
        session_id:
          type: string
          format: uuid
      required:
      - access
      - access_expires_in
      - refresh
      - session_expires_at
      - session_id
      - token_type
    TypeEnum:
      enum:
      - text
      - textarea
      - integer
      - decimal
      - date
      - choice
      - boolean
      type: string
      description: |-
        * `text` - text
        * `textarea` - textarea
        * `integer` - integer
        * `decimal` - decimal
        * `date` - date
        * `choice` - choice
        * `boolean` - boolean
    ValidateAnswersLanguageEnum:
      enum:
      - ru
      - kk
      - en
      type: string
      description: |-
        * `ru` - ru
        * `kk` - kk
        * `en` - en
    ValidateAnswersRequest:
      type: object
      properties:
        form_id:
          type: string
          format: uuid
        language:
          allOf:
          - $ref: '#/components/schemas/ValidateAnswersLanguageEnum'
          default: ru
        answers:
          description: Object keyed by field key. Decimal values are strings; integers/booleans
            are JSON numbers/booleans.
      required:
      - answers
      - form_id
    ValidationResult:
      type: object
      properties:
        form_id:
          type: string
          format: uuid
        form_version:
          type: integer
        valid:
          type: boolean
        errors:
          type: object
          additionalProperties:
            type: string
        visible_fields:
          type: array
          items:
            type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRequirement'
        notice:
          type: string
        submission_created:
          type: boolean
      required:
      - documents
      - errors
      - form_id
      - form_version
      - notice
      - submission_created
      - valid
      - visible_fields
    VerifyCodeRequest:
      type: object
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          pattern: ^[0-9]{6}$
        device_name:
          type: string
          default: ''
          maxLength: 80
      required:
      - challenge_id
      - code
    VerifyResult:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        token_type:
          type: string
        access_expires_in:
          type: integer
        session_expires_at:
          type: string
          format: date-time
        session_id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/CurrentUser'
        is_new_user:
          type: boolean
      required:
      - access
      - access_expires_in
      - is_new_user
      - refresh
      - session_expires_at
      - session_id
      - token_type
      - user
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
