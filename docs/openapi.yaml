      operationId: v1_orders_list
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: status
        schema:
          enum:
          - draft
          - awaiting_payment
          - submitted
          - under_review
          - needs_information
          - accepted
          - price_agreed
          - inspection_scheduled
          - in_progress
          - awaiting_report
          - completed
          - service_stopped
          - rejected
          - cancelled
          type: string
          minLength: 1
        description: |-
          * `draft` - Черновик
          * `awaiting_payment` - Ожидает оплаты
