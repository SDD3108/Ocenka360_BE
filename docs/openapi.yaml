openapi: 3.0.3
info:
  title: Оценка 360 API
  version: 0.3.0
  description: 'Part 3: service catalog, versioned questionnaires and document requirements.
    Orders, uploads and payments are not implemented yet.'
paths:
  /api/v1/:
    get:
      operationId: v1_retrieve
      tags:
      - System
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRoot'
          description: ''
  /api/v1/accounts/me/:
    get:
      operationId: v1_accounts_me_retrieve
      tags:
      - Accounts
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
    patch:
      operationId: v1_accounts_me_partial_update
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserRequest'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - Auth
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/logout-all/:
    post:
      operationId: v1_auth_logout_all_create
      tags:
      - Auth
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/request-code/:
    post:
      operationId: v1_auth_request_code_create
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCodeRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRequested'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/sessions/:
    get:
      operationId: v1_auth_sessions_list
      tags:
      - Auth
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthSession'
          description: ''
  /api/v1/auth/sessions/{session_id}/:
    delete:
      operationId: v1_auth_sessions_destroy
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Auth
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/verify-code/:
    post:
      operationId: v1_auth_verify_code_create
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/catalog/categories/:
    get:
      operationId: v1_catalog_categories_list
      parameters:
      - in: query
        name: language
        schema:
          enum:
          - ru
          - kk
          - en
          type: string
          default: ru
          minLength: 1
        description: |-
          * `ru` - ru
          * `kk` - kk
          * `en` - en
      tags:
      - Catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/catalog/services/:
    get:
      operationId: v1_catalog_services_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
      - in: query
        name: language
        schema:
          enum:
          - ru
          - kk
          - en
          type: string
          default: ru
          minLength: 1
        description: |-
          * `ru` - ru
          * `kk` - kk
          * `en` - en
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
      tags:
      - Catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedServiceList'
          description: ''
  /api/v1/catalog/services/{slug}/:
    get:
      operationId: v1_catalog_services_retrieve
      parameters:
      - in: query
        name: language
        schema:
          enum:
          - ru
          - kk
          - en
          type: string
          default: ru
          minLength: 1
        description: |-
          * `ru` - ru
          * `kk` - kk
          * `en` - en
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          description: ''
  /api/v1/catalog/services/{slug}/form/:
    get:
      operationId: v1_catalog_services_form_retrieve
      parameters:
      - in: query
        name: language
        schema:
          enum:
          - ru
          - kk
          - en
          type: string
          default: ru
          minLength: 1
        description: |-
          * `ru` - ru
          * `kk` - kk
          * `en` - en
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Form'
          description: ''
  /api/v1/catalog/services/{slug}/validate/:
    post:
      operationId: v1_catalog_services_validate_create
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateAnswersRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/config/:
    get:
      operationId: v1_config_retrieve
      tags:
      - System
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'
          description: ''
  /api/v1/health/live/:
    get:
      operationId: v1_health_live_retrieve
      tags:
      - System
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/health/ready/:
    get:
      operationId: v1_health_ready_retrieve
      tags:
      - System
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/legal/consents/:
    get:
      operationId: v1_legal_consents_list
      tags:
      - Legal
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Acceptance'
          description: ''
    post:
      operationId: v1_legal_consents_create
      tags:
      - Legal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/legal/documents/:
    get:
      operationId: v1_legal_documents_list
      parameters:
      - in: query
        name: language
        schema:
          enum:
          - ru
          - kk
          - en
          type: string
          default: ru
          minLength: 1
        description: |-
          * `ru` - Русский
          * `kk` - Қазақша
          * `en` - English
      tags:
      - Legal
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LegalDocument'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
components:
  schemas:
    Acceptance:
      type: object
      properties:
        document:
          $ref: '#/components/schemas/LegalDocument'
        accepted_at:
          type: string
          format: date-time
          readOnly: true
        document_checksum:
          type: string
          maxLength: 64
        adult_confirmed:
          type: boolean
      required:
      - accepted_at
      - document
      - document_checksum
    ApiRoot:
      type: object
      properties:
        service:
          type: string
        version:
          type: string
        api_version:
          type: string
      required:
      - api_version
      - service
      - version
    AuthSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        device_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - device_name
      - expires_at
      - id
      - last_used_at
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          readOnly: true
        service_count:
          type: integer
          readOnly: true
      required:
      - id
      - service_count
      - slug
      - title
    CodeRequested:
      type: object
      properties:
        challenge_id:
          type: string
          format: uuid
        expires_in:
          type: integer
        resend_after:
          type: integer
        message:
          type: string
      required:
      - challenge_id
      - expires_in
      - message
      - resend_after
    Company:
      type: object
      properties:
        name:
          type: string
        legal_name:
          type: string
          nullable: true
        phone:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
      required:
      - address
      - email
      - legal_name
      - name
      - phone
    Condition:
      type: object
      properties:
        field:
          type: string
        equals:
          description: Exact choice string or boolean; no expressions.
      required:
      - equals
      - field
    ConsentRequest:
      type: object
      properties:
        documents:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 3
          minItems: 3
        adult_confirmed:
          type: boolean
      required:
      - adult_confirmed
      - documents
    CurrentUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          title: Имя
          maxLength: 150
        last_name:
          type: string
          title: Фамилия
          maxLength: 150
        phone_number:
          title: Телефон
          oneOf:
          - type: string
            pattern: ^\+[1-9]\d{7,14}$
            maxLength: 16
          - type: string
            maxLength: 0
        phone_verified:
          type: boolean
          readOnly: true
        preferred_language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          title: Язык
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          title: Роль
        email_verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Email подтверждён
        adult_confirmed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Подтверждение 18+
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Дата регистрации
        requires_consent:
          type: boolean
          readOnly: true
      required:
      - adult_confirmed_at
      - date_joined
      - email
      - email_verified_at
      - id
      - phone_verified
      - requires_consent
      - role
    DocumentRequirement:
      type: object
      properties:
        key:
          type: string
        title:
          type: string
        help:
          type: string
        required:
          type: boolean
        when:
          $ref: '#/components/schemas/Condition'
      required:
      - help
      - key
      - required
      - title
    Error:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
      required:
      - code
      - details
      - message
    Features:
      type: object
      properties:
        email_otp:
          type: boolean
        catalog:
          type: boolean
        orders:
          type: boolean
        payments:
          type: boolean
        ai:
          type: boolean
      required:
      - ai
      - catalog
      - email_otp
      - orders
      - payments
    Form:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        checksum:
          type: string
        service:
          type: string
        language:
          type: string
        notice:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormField'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRequirement'
      required:
      - checksum
      - documents
      - fields
      - id
      - language
      - notice
      - service
      - version
    FormField:
      type: object
      properties:
        key:
          type: string
        type:
          $ref: '#/components/schemas/TypeEnum'
        label:
          type: string
        required:
          type: boolean
        help:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/Option'
        min:
          description: Integer or exact decimal string.
        max:
          description: Integer or exact decimal string.
        max_length:
          type: integer
        visible_if:
          $ref: '#/components/schemas/Condition'
      required:
      - key
      - label
      - required
      - type
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - status
    KindEnum:
      enum:
      - terms
      - privacy
      - personal_data
      type: string
      description: |-
        * `terms` - Пользовательское соглашение
        * `privacy` - Политика конфиденциальности
        * `personal_data` - Согласие на обработку данных
    LanguageEnum:
      enum:
      - ru
      - kk
      - en
      type: string
      description: |-
        * `ru` - Русский
        * `kk` - Қазақша
        * `en` - English
    LegalDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        version:
          type: string
          readOnly: true
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        content:
          type: string
          readOnly: true
        checksum:
          type: string
          readOnly: true
        is_draft:
          type: boolean
          readOnly: true
      required:
      - checksum
      - content
      - id
      - is_draft
      - kind
      - language
      - title
      - version
    Option:
      type: object
      properties:
        value:
          type: string
        label:
          type: string
      required:
      - label
      - value
    PaginatedServiceList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Service'
    PatchedCurrentUserRequest:
      type: object
      properties:
        first_name:
          type: string
          title: Имя
          maxLength: 150
        last_name:
          type: string
          title: Фамилия
          maxLength: 150
        phone_number:
          title: Телефон
          oneOf:
          - type: string
            pattern: ^\+[1-9]\d{7,14}$
            maxLength: 16
          - type: string
            maxLength: 0
        preferred_language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          title: Язык
    PublicConfig:
      type: object
      properties:
        company:
          $ref: '#/components/schemas/Company'
        default_language:
          type: string
        supported_languages:
          type: array
          items:
            type: string
        currency:
          type: string
        timezone:
          type: string
        features:
          $ref: '#/components/schemas/Features'
      required:
      - company
      - currency
      - default_language
      - features
      - supported_languages
      - timezone
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
          maxLength: 2048
      required:
      - refresh
    RequestCodeRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          default: ru
      required:
      - email
    RoleEnum:
      enum:
      - client
      - appraiser
      - admin
      type: string
      description: |-
        * `client` - Клиент
        * `appraiser` - Оценщик
        * `admin` - Администратор
    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        category:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        summary:
          type: string
          readOnly: true
        form_id:
          type: string
          format: uuid
          readOnly: true
        form_version:
          type: integer
          readOnly: true
      required:
      - category
      - form_id
      - form_version
      - id
      - slug
      - summary
      - title
    StatusEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    TokenPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        token_type:
          type: string
        access_expires_in:
          type: integer
        session_expires_at:
          type: string
          format: date-time
        session_id:
          type: string
          format: uuid
      required:
      - access
      - access_expires_in
      - refresh
      - session_expires_at
      - session_id
      - token_type
    TypeEnum:
      enum:
      - text
      - textarea
      - integer
      - decimal
      - date
      - choice
      - boolean
      type: string
      description: |-
        * `text` - text
        * `textarea` - textarea
        * `integer` - integer
        * `decimal` - decimal
        * `date` - date
        * `choice` - choice
        * `boolean` - boolean
    ValidateAnswersLanguageEnum:
      enum:
      - ru
      - kk
      - en
      type: string
      description: |-
        * `ru` - ru
        * `kk` - kk
        * `en` - en
    ValidateAnswersRequest:
      type: object
      properties:
        form_id:
          type: string
          format: uuid
        language:
          allOf:
          - $ref: '#/components/schemas/ValidateAnswersLanguageEnum'
          default: ru
        answers:
          description: Object keyed by field key. Decimal values are strings; integers/booleans
            are JSON numbers/booleans.
      required:
      - answers
      - form_id
    ValidationResult:
      type: object
      properties:
        form_id:
          type: string
          format: uuid
        form_version:
          type: integer
        valid:
          type: boolean
        errors:
          type: object
          additionalProperties:
            type: string
        visible_fields:
          type: array
          items:
            type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRequirement'
        notice:
          type: string
        submission_created:
          type: boolean
      required:
      - documents
      - errors
      - form_id
      - form_version
      - notice
      - submission_created
      - valid
      - visible_fields
    VerifyCodeRequest:
      type: object
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          pattern: ^[0-9]{6}$
        device_name:
          type: string
          default: ''
          maxLength: 80
      required:
      - challenge_id
      - code
    VerifyResult:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        token_type:
          type: string
        access_expires_in:
          type: integer
        session_expires_at:
          type: string
          format: date-time
        session_id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/CurrentUser'
        is_new_user:
          type: boolean
      required:
      - access
      - access_expires_in
      - is_new_user
      - refresh
      - session_expires_at
      - session_id
      - token_type
      - user
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
