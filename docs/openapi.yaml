components:
  schemas:
    AIDecisionInputRequest:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/AIReviewDecisionEnum'
        confirmed:
          type: boolean
        note:
          type: string
          default: ''
          maxLength: 500
      required:
      - confirmed
      - decision
    AIJobKindEnum:
      enum:
      - service_guide
      - form_help
      - material_check
      - photo_review
      - description_draft
      type: string
      description: |-
        * `service_guide` - Подбор услуги
        * `form_help` - Помощь с полем анкеты
        * `material_check` - Объяснение комплектности
        * `photo_review` - Предварительный анализ фото
        * `description_draft` - Черновик описания
    AIJobStateEnum:
      enum:
      - queued
      - running
      - succeeded
      - failed
      - unknown
      - cancelled
      - stale
      - expired
      type: string
      description: |-
        * `queued` - В очереди
        * `running` - Обрабатывается
        * `succeeded` - Готово
        * `failed` - Ошибка
        * `unknown` - Результат внешнего запроса неизвестен
        * `cancelled` - Отменено
        * `stale` - Исходные данные изменились
        * `expired` - Содержимое удалено по сроку
    AIReviewDecisionEnum:
      enum:
      - accepted
      - rejected
      type: string
      description: |-
        * `accepted` - accepted
        * `rejected` - rejected
    AcceptQuoteRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        confirmed:
          type: boolean
      required:
      - confirmed
      - expected_version
    AcceptRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        confirmed:
          type: boolean
      required:
      - confirmed
      - expected_version
    Acceptance:
      type: object
      properties:
        document:
          $ref: '#/components/schemas/LegalDocument'
        accepted_at:
          type: string
          format: date-time
          readOnly: true
        document_checksum:
          type: string
          maxLength: 64
        adult_confirmed:
          type: boolean
      required:
      - accepted_at
      - document
      - document_checksum
    AcquisitionSourceEnum:
      enum:
      - unknown
      - website
      - mobile
      - whatsapp
      - call
      - 2gis
      - instagram
      - referral
      - other
      type: string
      description: |-
        * `unknown` - Не указан
        * `website` - Сайт
        * `mobile` - Приложение
        * `whatsapp` - WhatsApp
        * `call` - Звонок
        * `2gis` - 2ГИС
        * `instagram` - Instagram
        * `referral` - Рекомендация
        * `other` - Другое
    ActionInputRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        confirmed:
          type: boolean
        reason:
          type: string
          default: ''
          maxLength: 500
      required:
      - confirmed
      - expected_version
    ApiRoot:
      type: object
      properties:
        service:
          type: string
        version:
          type: string
        api_version:
          type: string
      required:
      - api_version
      - service
      - version
    Appointment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        order_id:
          type: string
          format: uuid
          readOnly: true
        mode:
          allOf:
          - $ref: '#/components/schemas/InspectionModeEnum'
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/AppointmentStateEnum'
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        busy_from:
          type: string
          format: date-time
          readOnly: true
        busy_until:
          type: string
          format: date-time
          readOnly: true
        report_hours:
          type: integer
          readOnly: true
          nullable: true
        note:
          type: string
          readOnly: true
        confirmed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - busy_from
      - busy_until
      - confirmed_at
      - created_at
      - ends_at
      - id
      - mode
      - note
      - order_id
      - report_hours
      - starts_at
      - state
    AppointmentStateEnum:
      enum:
      - requested
      - offered
      - confirmed
      - in_progress
      - completed
      - cancelled
      - declined
      - superseded
      type: string
      description: |-
        * `requested` - Пожелание клиента
        * `offered` - Предложено оценщиком
        * `confirmed` - Подтверждено
        * `in_progress` - Осмотр начат
        * `completed` - Осмотр завершён
        * `cancelled` - Отменено
        * `declined` - Отклонено
        * `superseded` - Заменено
    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/AssetKindEnum'
          readOnly: true
        city:
          type: string
          readOnly: true
        address:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        is_archived:
          type: boolean
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - city
      - created_at
      - description
      - id
      - is_archived
      - kind
      - title
      - updated_at
      - version
    AssetCreateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        kind:
          $ref: '#/components/schemas/AssetKindEnum'
        city:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          default: ''
          maxLength: 300
        description:
          type: string
          default: ''
          maxLength: 2000
      required:
      - city
      - kind
      - title
    AssetKindEnum:
      enum:
      - apartment
      - house
      - land
      - commercial
      - vehicle
      - equipment
      - business
      - intangible
      - biological
      - other
      type: string
      description: |-
        * `apartment` - Квартира
        * `house` - Дом
        * `land` - Земля
        * `commercial` - Нежилой объект
        * `vehicle` - Транспорт
        * `equipment` - Оборудование
        * `business` - Бизнес
        * `intangible` - Нематериальные активы
        * `biological` - Биологические активы
        * `other` - Другое
    AudienceEnum:
      enum:
      - client
      - review
      type: string
      description: |-
        * `client` - Client
        * `review` - Reviewer
    AuthSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        device_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - device_name
      - expires_at
      - id
      - last_used_at
    BankConfirmationRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        transaction_id:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9_-]{1,128}$
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,2})?$
        confirmed_in_bank:
          type: boolean
      required:
      - amount
      - confirmed_in_bank
      - expected_version
      - transaction_id
    Block:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        reason:
          type: string
          readOnly: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cancelled_at
      - created_at
      - ends_at
      - id
      - reason
      - starts_at
    BlockCancelRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - reason
    BlockCreateRequest:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        client_request_id:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 300
      required:
      - client_request_id
      - ends_at
      - reason
      - starts_at
    Breakdown:
      type: object
      properties:
        code:
          type: string
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,2})?$
      required:
      - amount
      - code
    Calendar:
      type: object
      properties:
        timezone:
          type: string
        appointments:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/Block'
        report_deadlines:
          type: array
          items:
            $ref: '#/components/schemas/Inspection'
        truncated:
          type: boolean
      required:
      - appointments
      - blocks
      - report_deadlines
      - timezone
      - truncated
    CallbackRequest:
      type: object
      properties:
        invoiceId:
          type: string
          minLength: 1
          pattern: ^[0-9]{6}$
        secret_hash:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - invoiceId
      - secret_hash
    CallbackResult:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    CancelRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        reason:
          type: string
          default: ''
          maxLength: 1000
      required:
      - expected_version
    Case:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        order_id:
          type: string
          format: uuid
          readOnly: true
        reason:
          type: string
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/CaseStateEnum'
          readOnly: true
        retained_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        review_comment:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - decided_at
      - id
      - order_id
      - reason
      - retained_amount
      - review_comment
      - state
    CaseCreateRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        client_request_id:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - client_request_id
      - expected_version
      - reason
    CaseDecisionActionEnum:
      enum:
      - accept
      - withdraw
      type: string
      description: |-
        * `accept` - accept
        * `withdraw` - withdraw
    CaseDecisionRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        action:
          $ref: '#/components/schemas/CaseDecisionActionEnum'
        confirmed:
          type: boolean
          default: false
      required:
      - action
      - expected_version
    CaseOfferRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        retained_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,2})?$
        comment:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - comment
      - expected_version
      - retained_amount
    CaseResult:
      type: object
      properties:
        case:
          $ref: '#/components/schemas/Case'
        order_version:
          type: integer
        order_status:
          type: string
      required:
      - case
      - order_status
      - order_version
    CaseStateEnum:
      enum:
      - requested
      - offered
      - accepted
      - withdrawn
      type: string
      description: |-
        * `requested` - Запрос
        * `offered` - Условия предложены
        * `accepted` - Согласовано
        * `withdrawn` - Отозвано
    Category:
      type: object
