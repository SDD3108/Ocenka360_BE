          - price_agreed
          - inspection_scheduled
          - in_progress
          - awaiting_report
          - completed
          - service_stopped
          - rejected
          - cancelled
          type: string
          minLength: 1
        description: |-
          * `draft` - Черновик
          * `awaiting_payment` - Ожидает оплаты
          * `submitted` - Отправлена оценщику
          * `under_review` - На рассмотрении
          * `needs_information` - Нужны уточнения
          * `accepted` - Принята для согласования условий
          * `price_agreed` - Цена согласована клиентом
          * `inspection_scheduled` - Осмотр согласован
          * `in_progress` - Работа начата
          * `awaiting_report` - Готовится отчёт
          * `completed` - Отчёт опубликован
          * `service_stopped` - Услуга прекращена по согласованию
          * `rejected` - Отказ компании
          * `cancelled` - Отменена клиентом
