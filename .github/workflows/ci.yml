name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ocenka360_test
          POSTGRES_USER: ocenka360
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ocenka360 -d ocenka360_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements/*.txt'
      - run: python -m pip install -r requirements/dev.txt
      - name: Select PostgreSQL
        if: matrix.database == 'postgres'
        run: echo 'TEST_DATABASE_URL=postgresql://ocenka360:ci-only-password@127.0.0.1:5432/ocenka360_test' >> "$GITHUB_ENV"
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
      - run: diff -u docs/openapi.yaml /tmp/openapi.yaml
